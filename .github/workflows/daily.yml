name: Weekly Industry Hotspots Digest

on:
  schedule:
    - cron: "0 15 * * 0"  # UTC 15:00 = UTC+8 Sunday 23:00
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Run weekly industry digest
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        timeout-minutes: 20
        run: node scripts/run.js

      - name: Commit weekly digest
        id: commit
        run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          
          # 获取最新的远程更改
          git fetch origin main
          
          # 尝试合并远程更改（使用 rebase 保持历史干净）
          git pull origin main --rebase --no-edit || {
            echo "Rebase failed, trying merge instead..."
            git pull origin main --no-edit || {
              echo "Merge also failed, resetting to remote..."
              git fetch origin main
              git reset --hard origin/main
            }
          }
          
          DATE=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
          echo "date=${DATE}" >> $GITHUB_OUTPUT
          
          git add weekly/
          git commit -m "chore: weekly industry hotspots digest ${DATE}" || echo "No changes to commit"
          
          # 推送更改
          git push origin main
      
      - name: Create GitHub Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 从上一步获取变量
          DATE="${{ steps.commit.outputs.date }}"
          
          # 生成文件名
          FILENAME="weekly/${DATE}-industry-hotspots.md"
          
          # 检查文件是否存在
          if [ ! -f "$FILENAME" ]; then
            echo "⚠️  File $FILENAME not found, skipping issue creation"
            exit 0
          fi
          
          # 读取 Markdown 文件内容
          MD_CONTENT=$(cat "$FILENAME")
          
          # 创建 Issue 标题
          ISSUE_TITLE="行业热点与中长线投资线索周报 - ${DATE}"
          
          # 定义需要的标签及其配置
          # 格式: "标签名|颜色|描述"
          LABEL_CONFIGS=(
            "weekly-digest|0E8A16|Weekly industry hotspots digest"
            "automated|7057FF|Automated by GitHub Actions"
          )
          
          # 自动创建标签（如果不存在）
          echo "🏷️  Checking and creating labels..."
          for LABEL_CONFIG in "${LABEL_CONFIGS[@]}"; do
            # 解析配置
            IFS='|' read -r LABEL COLOR DESCRIPTION <<< "$LABEL_CONFIG"
            
            # 检查标签是否存在（使用更精确的匹配）
            LABEL_EXISTS=$(gh label list --json name --jq ".[] | select(.name==\"${LABEL}\") | .name" 2>/dev/null | grep -q "^${LABEL}$" && echo "yes" || echo "no")
            
            if [ "$LABEL_EXISTS" = "no" ]; then
              echo "   📝 Creating label: ${LABEL}"
              # 创建标签
              gh label create "${LABEL}" \
                --color "${COLOR}" \
                --description "${DESCRIPTION}" 2>&1 || {
                  echo "   ⚠️  Failed to create label: ${LABEL}, but continuing..."
                }
            else
              echo "   ✓ Label already exists: ${LABEL}"
            fi
          done
          
          # 使用 GitHub CLI 创建 Issue
          echo "📝 Creating GitHub Issue: $ISSUE_TITLE"
          
          # 创建 Issue（带标签）
          gh issue create \
            --title "$ISSUE_TITLE" \
            --body "$MD_CONTENT" \
            --label "weekly-digest" \
            --label "automated" 2>&1 || {
              echo "❌ Issue creation failed, but continuing workflow"
              exit 0  # 不中断工作流
            }
          
          echo "✅ Issue created successfully"

